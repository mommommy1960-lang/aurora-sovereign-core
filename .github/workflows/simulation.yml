name: Aurora Simulation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurora-simulation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest -q
      - run: python -m aurora.demo
